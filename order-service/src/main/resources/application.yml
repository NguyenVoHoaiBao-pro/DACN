spring:
  application:
    name: order-service
  config:
    import: "optional:configserver:http://localhost:8888"
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql-11ae5c82-cjcakvalvajvjallh.i.aivencloud.com}:${MYSQL_PORT:28570}/electro_order_db?useSSL=${MYSQL_USE_SSL:true}&requireSSL=${MYSQL_REQUIRE_SSL:true}&sslMode=${MYSQL_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${MYSQL_USER:avnadmin}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8086

ghn:
  base-url: ${GHN_BASE_URL:https://online-gateway.ghn.vn}
  fallback-shipping-fee: 30000

# VNPay — khai bao tai day de khong phu thuoc config-server (tranh YOUR_TMN_CODE mac dinh)
payment:
  frontend-success-url: ${PAYMENT_FRONTEND_SUCCESS_URL:http://localhost:5173/payment/success}
  frontend-fail-url: ${PAYMENT_FRONTEND_FAIL_URL:http://localhost:5173/payment/fail}
  backend-base-url: ${PAYMENT_BACKEND_BASE_URL:http://localhost:8080}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:1T0D4TUS}
    hash-secret: ${VNPAY_HASH_SECRET:UNVQ0K206FIK1H2PNV667HPWJ2ARZMWD}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay/return}
    version: "2.1.0"
    command: pay
    order-type: other
    locale: vn
    curr-code: VND

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha


management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      ghn-shipping:
        base-config: default
      catalogService:
        base-config: default
      cartService:
        base-config: default
      userService:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 8s
