# Cấu hình 3 mốc kiểm thử tải — Apache JMeter
# Copy các giá trị vào Thread Group / CSV Data Set Config tương ứng.
#
# Base URL (HTTP Request Defaults):
baseUrl=http://localhost:8080
#
# CSV Data Set Config:
#   Filename: scripts/load-test/seed-500-users.csv  (500 tài khoản — mốc 500)
#   Variable Names: username,password,user_id
#   Delimiter: ,
#   Recycle on EOF: true
#   Stop thread on EOF: false
#   Sharing mode: All threads
#
# ─── Mốc 1: 500 Virtual Users ───────────────────────────────────────────────
scenario.500.name=Mức 500 Người Dùng
scenario.500.threads=500
scenario.500.rampUpSeconds=60
scenario.500.durationSeconds=300
scenario.500.loopCount=-1
scenario.500.targetDuration=5m
#
# ─── Mốc 2: 1000 Virtual Users ──────────────────────────────────────────────
scenario.1000.name=Mức 1000 Người Dùng
scenario.1000.threads=1000
scenario.1000.rampUpSeconds=120
scenario.1000.durationSeconds=300
scenario.1000.loopCount=-1
scenario.1000.targetDuration=5m
#
# ─── Mốc 3: 2000 Virtual Users ──────────────────────────────────────────────
scenario.2000.name=Load_2000_Users
scenario.2000.threads=2000
scenario.2000.rampUpSeconds=180
scenario.2000.durationSeconds=300
scenario.2000.loopCount=-1
scenario.2000.targetDuration=5m
#
# Tỷ lệ traffic (Throughput Controller / Random Controller):
#   products=35, login=10, cart=15, recommend=25, chatbot=15
#
# Chatbot — giới hạn riêng (Ultimate Thread Group hoặc thread pool nhỏ):
chatbot.threads=10
chatbot.rampUpSeconds=30
chatbot.thinkTimeSeconds=3
