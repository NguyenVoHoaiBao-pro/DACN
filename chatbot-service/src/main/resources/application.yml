server:
  port: 8092

spring:
  application:
    name: chatbot-service
  profiles:
    active: dev
  config:
    import: "optional:configserver:http://localhost:8888"

  ai:
    openai:
      api-key: ${NVIDIA_API_KEY:nvapi-dummy-key-replace-this}
      base-url: https://integrate.api.nvidia.com
      chat:
        options:
          model: ${NVIDIA_CHAT_MODEL:meta/llama-3.1-8b-instruct}
      embedding:
        options:
          model: ${NVIDIA_EMBEDDING_MODEL:nvidia/nv-embed-v1}
    vectorstore:
      pinecone:
        api-key: ${PINECONE_API_KEY}
        index-name: ${PINECONE_INDEX_NAME:electro-store-products}
        namespace: ${PINECONE_NAMESPACE:}
        server-side-timeout: ${PINECONE_TIMEOUT:30s}

# Phase 2 RAG: hybrid (dense NVIDIA + sparse Pinecone) + rerank
rag:
  top-k: ${RAG_TOP_K:4}
  retrieval-top-k: ${RAG_RETRIEVAL_TOP_K:40}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.0}
  hybrid:
    enabled: ${RAG_HYBRID_ENABLED:true}
    alpha: ${RAG_HYBRID_ALPHA:0.75}
    sparse-model: ${RAG_SPARSE_MODEL:pinecone-sparse-english-v0}
  rerank:
    enabled: ${RAG_RERANK_ENABLED:true}
    model: ${RAG_RERANK_MODEL:bge-reranker-v2-m3}
    top-n: ${RAG_RERANK_TOP_N:4}
  ingest:
    page-size: ${RAG_INGEST_PAGE_SIZE:50}
    include-reviews: ${RAG_INGEST_INCLUDE_REVIEWS:false}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
